<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAT 103 Descriptive Statistics Analyzer</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:1100px;margin:auto;padding:20px;background:#f4f6f9}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
textarea{width:100%;height:150px}
button{padding:10px 20px;font-size:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:15px}
.stat{background:#eef3ff;padding:10px;border-radius:8px}
#histogram,#boxplot{height:400px;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<h1>Descriptive Statistics Analyzer</h1>
<p>Enter numbers separated by commas, spaces, or new lines.</p>
<textarea id="dataInput">4,5,7,8,10,12,14,15,18,20</textarea><br><br>
<button onclick="analyze()">Analyze Data</button>

<div id="results" class="grid"></div>
<div id="histogram"></div>
<div id="boxplot"></div>
</div>

<script>
function parseData(){
  return document.getElementById('dataInput').value
    .split(/[\s,]+/)
    .map(Number)
    .filter(x=>!isNaN(x));
}

function mean(a){return a.reduce((s,x)=>s+x,0)/a.length;}
function median(a){
 let b=[...a].sort((x,y)=>x-y);
 let m=Math.floor(b.length/2);
 return b.length%2?b[m]:(b[m-1]+b[m])/2;
}
function mode(a){
 let f={}; let max=0; let modes=[];
 a.forEach(x=>{f[x]=(f[x]||0)+1; max=Math.max(max,f[x]);});
 for(let k in f){if(f[k]===max) modes.push(k);}
 return modes.join(", ");
}
function variance(a){
 let m=mean(a);
 return a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1);
}
function stddev(a){return Math.sqrt(variance(a));}

function analyze(){
 let d=parseData();
 if(d.length<2){alert("Enter at least two numbers."); return;}
 let stats={
  "Sample Size":d.length,
  "Mean":mean(d).toFixed(3),
  "Median":median(d).toFixed(3),
  "Mode":mode(d),
  "Minimum":Math.min(...d),
  "Maximum":Math.max(...d),
  "Range":(Math.max(...d)-Math.min(...d)).toFixed(3),
  "Variance":variance(d).toFixed(3),
  "Std Dev":stddev(d).toFixed(3)
 };

 let results=document.getElementById("results");
 results.innerHTML="";
 for(let k in stats){
   results.innerHTML += `<div class="stat"><b>${k}</b><br>${stats[k]}</div>`;
 }

 Plotly.newPlot("histogram",[{
   x:d,type:"histogram"
 }],{title:"Histogram"});

 Plotly.newPlot("boxplot",[{
   y:d,type:"box",boxpoints:"all"
 }],{title:"Box Plot"});
}
analyze();
</script>
</body>
</html>
